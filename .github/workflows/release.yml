name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Full history: the release intro is read from the tag's own
          # message below, and checkout leaves only a lightweight ref behind
          # (see that step).
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Take the release intro from the tag message
        run: |
          set -eu
          # actions/checkout fetches every tag, then overwrites this one with
          # a lightweight ref to the commit it points at
          # (+<sha>:refs/tags/<name>), so the annotated object is gone by the
          # time this step runs and the guard below writes nothing. Fetch the
          # tag object back first.
          git fetch --force origin \
            "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          # Only an annotated tag carries a message of its own. For a
          # lightweight tag %(contents:...) silently falls back to the commit
          # message - trailers and all - so guard on the object type and write
          # nothing rather than leaking a commit message into the release.
          #
          # Subject *and* body: git counts the message's first paragraph as the
          # subject, so %(contents:body) alone drops it, and the first paragraph
          # of a message written for users is the sentence that says what the
          # release is. Not %(contents), which would carry a signature block
          # into the release text if a tag is ever signed - the body stops
          # before it.
          if git rev-parse -q --verify "refs/tags/${GITHUB_REF_NAME}" >/dev/null \
             && [ "$(git cat-file -t "refs/tags/${GITHUB_REF_NAME}")" = "tag" ]; then
            git tag -l --format='%(contents:subject)%0a%0a%(contents:body)' \
              "${GITHUB_REF_NAME}" > release-intro.md
          else
            : > release-intro.md
          fi
          if [ -s release-intro.md ]; then printf '\n---\n' >> release-intro.md; fi
          echo "--- release intro ---"
          cat release-intro.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/gauge-studio.js
          # Prepended to the generated notes by the action.
          body_path: release-intro.md
          generate_release_notes: true
          # A tag with a suffix - `v2.5.0-beta.1` - is a pre-release, and that
          # word is the whole of the beta channel: HACS offers a pre-release
          # only to someone who has ticked "show beta versions" on this
          # repository, and goes on offering everyone else the newest release
          # without one. There is no branch behind it - a pre-release is tagged
          # off `main` like any other, because merging into `main` publishes
          # nothing and only a tag does.
          #
          # Said explicitly rather than left to the action to guess, because
          # what it guesses is what decides whether a test build lands on every
          # installed dashboard.
          prerelease: ${{ contains(github.ref_name, '-') }}
